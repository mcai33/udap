[package]
name = "udap"
version = "26.34.2"
description = "A cross-platform CMSIS-DAP programmer"
authors = ["uDAP contributors"]
edition = "2024"

[lib]
name = "udap_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
probe-rs = "=0.32.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
thiserror = "2"
