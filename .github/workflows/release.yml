name: Release

on:
  workflow_dispatch:
  push:
    tags: ["app-v*"]

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: uDAP Programmer v__VERSION__
          releaseBody: "Cross-platform uDAP Programmer release."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  win7-cli:
    name: Win7 x64 portable CLI
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-08-01
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: udap-cli
          key: win7-x64
      - name: Read CLI version
        id: version
        shell: pwsh
        run: |
          $metadata = cargo metadata --manifest-path udap-cli/Cargo.toml --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=app-v$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows 7 compatible CLI
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: cargo +nightly-2026-08-01 build --manifest-path udap-cli/Cargo.toml --release --target x86_64-win7-windows-msvc -Z build-std=std,panic_abort
      - name: Package portable ZIP
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP "udap-cli-win7-x64"
          $release = Join-Path $PWD "release"
          New-Item -ItemType Directory -Force -Path $stage, $release | Out-Null
          Copy-Item "udap-cli/target/x86_64-win7-windows-msvc/release/udap-cli.exe" $stage
          Copy-Item "udap-cli/README.txt" $stage
          $archive = Join-Path $release "uDAP-Programmer_${{ steps.version.outputs.version }}_win7-x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -Force
      - uses: actions/upload-artifact@v4
        with:
          name: udap-cli-win7-x64
          path: release/*.zip
          if-no-files-found: error

  attach-win7-cli:
    name: Attach Win7 CLI to release
    needs: [publish, win7-cli]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: udap-cli-win7-x64
          path: release
      - name: Upload portable ZIP to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.win7-cli.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" release/*.zip --clobber --repo "$GITHUB_REPOSITORY"
